[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-x"
dynamic = ["version"]
description = "Zero-trust security and governance fabric for LLM, RAG and multi-agent systems"
readme = "README.md"
requires-python = ">=3.11"
# Tested on 3.13 locally; CI covers 3.11-3.13
license = { text = "Apache-2.0" }
authors = [{ name = "Nikhil Chary Sriramoju" }]
keywords = ["llm-security", "prompt-injection", "rag", "ai-agents", "zero-trust", "mcp", "audit-log", "merkle-tree", "post-quantum"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=50.0.1",
  "pyyaml>=6.0.1",
  "numpy>=1.26",
  "pillow>=10.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.162.0,<1", "uvicorn[standard]>=0.30", "pydantic>=2.7,<3"]
vision = ["opencv-python-headless>=4.9", "onnxruntime>=1.18"]
text-ml = ["onnxruntime>=1.18", "tokenizers>=0.19"]
stores = ["asyncpg>=0.29", "redis>=5.0"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-instrumentation-fastapi>=0.46b0"]
docs = ["markdown>=3.5"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
all = ["agentshield-x[api,vision,text-ml,stores,otel,docs]"]

[project.scripts]
agentshield = "agentshield.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agentshield.__version__" }

[tool.setuptools.packages.find]
include = ["agentshield*"]

[tool.setuptools.package-data]
agentshield = ["static/*.html"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "C4", "SIM"]
ignore = ["S101", "S311", "E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"evals/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
