name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      packages: write        # push the image to GHCR
      id-token: write        # keyless signing + provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test before release
        run: |
          pip install -e ".[dev,api,vision]"
          PYTHONPATH=. python -W ignore -m unittest tests.test_security_pipeline tests.test_extensions
      - name: Build sdist + wheel
        run: pip install build && python -m build
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with: { path: ".", format: spdx-json, output-file: sbom.spdx.json }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: img
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.img.outputs.digest }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.spdx.json
          generate_release_notes: true
