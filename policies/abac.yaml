# ABAC deny rules (deny-overrides). A rule fires when ALL conditions hold. Operators: eq ne in not_in lt lte gt gte exists matches contains.
# A value of {"$ref": "path"} compares against another attribute.
version: 1
rules:
- id: fin.limit
  when:
  - - tool.effect
    - eq
    - financial
  - - args.amount
    - gt
    - 10000
  - - principal.attrs.finance_limit_ok
    - ne
    - true
  reason: transfers over 10,000 require finance_limit_ok attribute
- id: fin.self
  when:
  - - tool.effect
    - eq
    - financial
  - - args.from_account
    - eq
    - $ref: args.to_account
  reason: source and destination accounts must differ
- id: exec.clearance
  when:
  - - tool.effect
    - eq
    - exec
  - - principal.attrs.clearance
    - lt
    - 1
  reason: code execution requires clearance >= 1
- id: prod.offhours
  when:
  - - context.env
    - eq
    - prod
  - - tool.effect
    - in
    - - delete
      - financial
  - - context.hour_utc
    - lt
    - 6
  reason: destructive/financial actions are blocked 00:00-06:00 UTC in prod
- id: tenant.mismatch
  when:
  - - principal.attrs.tenant
    - exists
    - true
  - - args.tenant
    - exists
    - true
  - - args.tenant
    - ne
    - $ref: principal.attrs.tenant
  reason: cross-tenant access
